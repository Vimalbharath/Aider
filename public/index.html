<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="theme-color" content="#000000" />
    <meta name="description" content="Vimalbharath Kumar - Software Development Engineer Portfolio" />
    <title>Vimalbharath Kumar | Portfolio</title>
    <style>
      * {
        box-sizing: border-box;
        margin: 0;
        padding: 0;
      }
      body {
        font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'Roboto', 'Oxygen',
          'Ubuntu', 'Cantarell', 'Fira Sans', 'Droid Sans', 'Helvetica Neue',
          sans-serif;
        -webkit-font-smoothing: antialiased;
        -moz-osx-font-smoothing: grayscale;
        background-color: #0f172a;
        color: #f8fafc;
        overflow-x: hidden;
      }

      /* Running glare animation keyframes */
      @keyframes glowingBorder {
        0% {
          background-position: 0% 50%;
        }
        50% {
          background-position: 100% 50%;
        }
        100% {
          background-position: 0% 50%;
        }
      }

      @keyframes pulseGlow {
        0%, 100% {
          box-shadow: 0 0 15px rgba(56, 189, 248, 0.4), 0 0 30px rgba(139, 92, 246, 0.2);
        }
        50% {
          box-shadow: 0 0 25px rgba(56, 189, 248, 0.8), 0 0 50px rgba(139, 92, 246, 0.5);
        }
      }

      /* Animated Glowing Card Border */
      .glowing-card {
        position: relative;
        background: #1e293b;
        border-radius: 12px;
        z-index: 1;
        transition: transform 0.3s ease, box-shadow 0.3s ease;
      }

      .glowing-card::before {
        content: '';
        position: absolute;
        top: -2px;
        left: -2px;
        right: -2px;
        bottom: -2px;
        background: linear-gradient(45deg, #38bdf8, #8b5cf6, #ec4899, #38bdf8);
        background-size: 400% 400%;
        z-index: -1;
        border-radius: 14px;
        animation: glowingBorder 6s ease infinite;
        opacity: 0.7;
      }

      .glowing-card:hover {
        transform: translateY(-4px);
      }

      .glowing-card:hover::before {
        opacity: 1;
        animation: glowingBorder 3s ease infinite;
      }

      /* Glaring Action Button */
      .glare-btn {
        position: relative;
        display: inline-flex;
        align-items: center;
        gap: 6px;
        padding: 8px 18px;
        border-radius: 8px;
        font-size: 0.9rem;
        font-weight: 600;
        text-decoration: none;
        color: #ffffff;
        background: linear-gradient(90deg, #0284c7, #6366f1, #0284c7);
        background-size: 200% 100%;
        border: none;
        overflow: hidden;
        transition: all 0.3s ease;
        box-shadow: 0 4px 15px rgba(2, 132, 199, 0.4);
      }

      .glare-btn:hover {
        background-position: 100% 0;
        box-shadow: 0 6px 20px rgba(99, 102, 241, 0.6);
        transform: translateY(-2px);
      }

      /* Profile Image Outer Glowing Ring */
      .profile-img-container {
        position: relative;
        width: 140px;
        height: 140px;
        margin: 0 auto 20px;
        border-radius: 50%;
        padding: 4px;
        background: linear-gradient(45deg, #38bdf8, #8b5cf6, #ec4899);
        background-size: 300% 300%;
        animation: glowingBorder 4s ease infinite, pulseGlow 3s ease-in-out infinite;
      }

      .profile-img {
        width: 100%;
        height: 100%;
        object-fit: cover;
        border-radius: 50%;
        background-color: #0f172a;
        display: block;
      }
    </style>
  </head>
  <body>
    <noscript>You need to enable JavaScript to run this app.</noscript>
    <div id="root"></div>
  </body>
</html>
